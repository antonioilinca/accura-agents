metier: electricien
libelle: "Électricien (installation et rénovation électrique)"

travaux_pertinents: >
  Installation et mise aux normes électriques, tableaux, réseaux, éclairage, bornes de
  recharge, domotique. Intervient sur la quasi-totalité des extensions, surélévations,
  aménagements de combles, changements de destination et rénovations lourdes (toute
  surface neuve ou réhabilitée doit être câblée et mise aux normes).

mots_cles_positifs:
  - extension
  - surélévation
  - aménagement de combles
  - rénovation
  - réhabilitation
  - changement de destination
  - création de logement
  - garage en pièce de vie
  - borne de recharge
  - photovoltaïque

exclusions:
  - clôture
  - portail
  - ravalement de façade seul
  - abri de jardin sans électricité
  - mur de soutènement
  - division parcellaire
  - piscine sans local technique
