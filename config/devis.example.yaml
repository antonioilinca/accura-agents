    conditions:
      - "Chiffrage indicatif multi-lots à affiner après visite technique."
    postes:
      - code: coordination
        libelle: "Préparation, coordination et protection chantier"
        unite: "forfait"
        prix_unitaire_ht: "450"
        mots_cles: ["rénovation", "renovation", "refaire", "travaux"]
      - code: main_oeuvre_renovation
        libelle: "Main-d'oeuvre rénovation intérieure estimative"
