        libelle: "Préparation supports, rebouchage léger et protection"
        unite: "m²"
        prix_unitaire_ht: "14"
        quantite_depuis: "surface_m2"
        mots_cles: ["peinture", "mur", "plafond", "enduit"]
      - code: peinture_2_couches
        libelle: "Application peinture deux couches"
        unite: "m²"
        prix_unitaire_ht: "22"
        quantite_depuis: "surface_m2"
        mots_cles: ["peinture", "mur", "plafond"]

  carrelage:
    libelle: "Carrelage / faïence"
    mots_cles: ["carrelage", "carreleur", "faïence", "faience", "sol carrelé", "terrasse carrelée"]
    questions_requises: ["ville", "surface", "prestations", "gamme_materiaux", "photos"]
    conditions:
      - "Support supposé plan, stable et prêt à recevoir le carrelage."
      - "Hors ragréage lourd, étanchéité complexe ou dépose non précisée."
