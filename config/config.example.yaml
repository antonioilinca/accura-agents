# ============================================================================
# Agent acquisition de leads — Accura Ouest
# Copie ce fichier en config/config.yaml puis adapte-le. config.yaml n'est PAS
# versionné (chaque artisan / zone a sa propre config).
# ============================================================================

# Métier ciblé : correspond à un fichier de config/metiers/ (sans .yaml).
# Disponibles par défaut : plombier, electricien, couvreur.
metier: plombier

zone:
  rayon_km: 20            # indicatif (le filtrage réel se fait sur la liste de communes)
  # Communes scannées. Par défaut : les 24 communes de Nantes Métropole (~20 km).
  # Les noms doivent correspondre exactement au champ "commune" de l'open data.
  communes:
    - Nantes
    - Saint-Herblain
    - Rezé
    - Saint-Sébastien-sur-Loire
    - Orvault
    - Vertou
    - Couëron
    - Carquefou
    - Bouguenais
    - La Chapelle-sur-Erdre
    - Sainte-Luce-sur-Loire
    - Basse-Goulaine
    - Les Sorinières
    - Thouaré-sur-Loire
    - Sautron
    - Saint-Aignan-Grandlieu
    - Bouaye
    - La Montagne
    - Saint-Jean-de-Boiseau
    - Le Pellerin
    - Indre
    - Mauves-sur-Loire
    - Brains
    - Saint-Léger-les-Vignes

sources:
  # SOCLE — open data public, gratuit, légal, frais. Recommandé actif.
  urbanisme_nantes:
    actif: true
    jours_recents: 30     # ne traite que les dossiers déposés dans les N derniers jours

  # ÉLARGISSEMENT hors Nantes Métropole — non encore validé. Laisser à false.
  sitadel:
    actif: false
    departement: "44"

  # Demandes Facebook / bouche-à-oreille collées à la main (humain dans la boucle).
  inbox_manuelle:
    actif: true
    fichier: inbox/leads_manuels.md

# ----------------------------------------------------------------------------
# Fournisseur d'IA. Tant qu'il n'y a pas de client : on reste sur du GRATUIT.
# Bascule sur Claude (qualité max) quand un client paie -> il suffit de changer ce bloc.
#
#  GROQ (défaut, gratuit, Llama 3.3 70B) :
#     provider: openai_compat
#     base_url: https://api.groq.com/openai/v1
#     api_key_env: GROQ_API_KEY
#     modele_tri / modele_qualif: llama-3.3-70b-versatile
#
#  MISTRAL (gratuit, européen / RGPD-friendly) :
#     base_url: https://api.mistral.ai/v1   | api_key_env: MISTRAL_API_KEY
#     modeles: mistral-small-latest (tri) / mistral-large-latest (qualif)
#
#  OLLAMA (local, 100% offline, illimité) :
#     base_url: http://localhost:11434/v1   | api_key_env: ""   (aucune clé)
#     modeles: qwen2.5-coder:7b  (qualité moindre qu'un 70B)
#
#  CLAUDE (payant, qualité max — quand un client paie) :
#     provider: anthropic   | api_key_env: ANTHROPIC_API_KEY
#     modeles: claude-haiku-4-5 (tri) / claude-sonnet-4-6 (qualif)
# ----------------------------------------------------------------------------
llm:
  provider: openai_compat
  base_url: https://api.groq.com/openai/v1
  api_key_env: GROQ_API_KEY
  modele_tri: llama-3.3-70b-versatile
  modele_qualif: llama-3.3-70b-versatile
  max_retry_after_seconds: 120  # au-delà, le run saute le lead au lieu d'attendre trop longtemps
  intervalle_min_s: 2.5         # espacement minimal entre appels (évite les 429 du free tier)

qualification:
  seuil_livraison: 60     # ne livre que les leads dont le score est >= à cette valeur
  taille_lot_tri: 25      # nombre d'annonces triées par appel
  objectif_hebdo_min: 2   # promesse pack Croissance : 2 à 3 prospects qualifiés / semaine
  objectif_hebdo_max: 3   # l'agent ne dépasse pas ce plafond de livraison hebdomadaire
  max_qualif_par_run: 60  # coût/durée bornés ; le surplus revient au prochain run
  surface_max_artisan: 600  # au-delà : score plafonné en code (échelle promoteur, pas artisan)

sortie:
  dossier: outputs

# Prix API en USD par million de tokens — sert UNIQUEMENT à estimer le coût quand on
# utilise Claude (les fournisseurs gratuits affichent 0). Vérifiés juin 2026.
pricing_usd_par_million:
  haiku_input: 1.0
  haiku_output: 5.0
  sonnet_input: 3.0
  sonnet_output: 15.0
