[project]
name = "accura-agents"
version = "0.1.0"
description = "Agents IA d'Accura Ouest — acquisition de leads pour artisans rénovation (Nantes & Pays de la Loire)"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.69",
    "requests>=2.31",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

# Extra optionnel : transcription vocale locale (agent voice_intake).
# Activer avec : uv pip install faster-whisper  (ou: uv sync --extra voice)
# Le cœur du projet n'en dépend pas (import paresseux dans voice_intake).
[project.optional-dependencies]
voice = ["faster-whisper>=1.0"]

[tool.uv]
package = false
